name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
    - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
    - run: npm install
    - run: npm test
